<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>grod</title>
    <link rel="stylesheet" href="ui/grod.css" />
    <style>
      body {
        width: 360px;
        padding: var(--g-space-16);
      }
      header {
        margin: 0 0 var(--g-space-16);
        padding: 0 calc(var(--g-space-12) + 1px);
        font-size: var(--g-font-size-16);
      }
    </style>
  </head>
  <body class="g-app g-app--compact">
    <header>
      <span class="g-brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="9" r="5" />
          <path d="M17 4v11.5a5 5 0 0 1-5 5H9" />
        </svg>
        grod
      </span>
    </header>
    <section class="g-section">
      <dl class="g-kv g-section__body g-section__body--padded">
        <dt>Revision</dt>
        <dd><code id="revision">none</code></dd>
        <dt>Source</dt>
        <dd id="source">none</dd>
        <dt>Last fetch</dt>
        <dd id="fetched">never</dd>
        <dt>This tab</dt>
        <dd id="tab">none</dd>
      </dl>
    </section>
    <section class="g-section">
      <h2 class="g-section__title">Pauses by rule</h2>
      <ul class="g-list g-section__body" id="rules"></ul>
    </section>
    <script src="lib/rules-core.js"></script>
    <script type="module" src="popup.js"></script>
  </body>
</html>
