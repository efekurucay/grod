<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>grod</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f5f2;
        --fg: #22211f;
        --muted: #6b6862;
        --line: #dedbd4;
        --on: #2f7d4f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1c1b;
          --fg: #e9e7e2;
          --muted: #9a968e;
          --line: #34332f;
          --on: #6cc08f;
        }
      }
      body {
        width: 320px;
        margin: 0;
        padding: 14px 16px;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.45 system-ui, -apple-system, sans-serif;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 15px;
        font-weight: 600;
      }
      h2 {
        margin: 14px 0 6px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 2px 12px;
        margin: 0;
      }
      dt {
        color: var(--muted);
      }
      dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      code {
        font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      li {
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding: 5px 0;
        border-top: 1px solid var(--line);
      }
      li .title {
        flex: 1;
      }
      li .count {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      li.off {
        color: var(--muted);
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--line);
      }
      li:not(.off) .dot {
        background: var(--on);
      }
    </style>
  </head>
  <body>
    <h1>grod</h1>
    <dl>
      <dt>Revision</dt>
      <dd><code id="revision">none</code></dd>
      <dt>Source</dt>
      <dd id="source">none</dd>
      <dt>Last fetch</dt>
      <dd id="fetched">never</dd>
      <dt>This tab</dt>
      <dd id="tab">none</dd>
    </dl>
    <h2>Rules</h2>
    <ul id="rules"></ul>
    <script src="lib/rules-core.js"></script>
    <script type="module" src="popup.js"></script>
  </body>
</html>
