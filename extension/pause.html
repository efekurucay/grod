<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pause · grod</title>
    <link rel="stylesheet" href="ui/grod.css" />
    <style>
      /* Wheel and touch on the pause screen must not scroll the page under it. */
      html {
        overscroll-behavior: none;
      }
      .actions {
        display: flex;
        gap: var(--g-space-12);
      }
      /* .g-button sets display, which would otherwise show a hidden Continue. */
      .g-button[hidden] {
        display: none;
      }
      .countdown {
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body class="g-app">
    <main class="g-interstitial">
      <div class="g-interstitial__body">
        <p class="g-interstitial__label">
          <span class="g-brand">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
              <circle cx="12" cy="9" r="5" />
              <path d="M17 4v11.5a5 5 0 0 1-5 5H9" />
            </svg>
            grod
          </span>
        </p>
        <h1 class="g-interstitial__title" id="title">Pause</h1>
        <p class="g-interstitial__why" id="why"></p>
        <dl class="g-kv g-interstitial__why">
          <dt>Scrolled this session</dt>
          <dd id="scrolled"></dd>
          <dt>Wait</dt>
          <dd class="countdown" id="countdown"></dd>
        </dl>
        <div class="actions">
          <button class="g-button g-button--quiet" id="leave" type="button">Leave</button>
          <button class="g-button" id="continue" type="button" hidden>Continue</button>
        </div>
      </div>
    </main>
    <script type="module" src="pause.js"></script>
  </body>
</html>
