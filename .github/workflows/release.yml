name: release

# Push a tag like v0.2.0: builds the signed APK and the extension zip and publishes them as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Version from tag
        id: v
        run: |
          version="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "${version%%-*}"
          echo "name=$version" >> "$GITHUB_OUTPUT"
          # Android needs a growing integer: 0.2.3 -> 203.
          echo "code=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_OUTPUT"

      - name: Android APK
        working-directory: android
        env:
          GROD_KEYSTORE_PASSWORD: ${{ secrets.GROD_KEYSTORE_PASSWORD }}
          GROD_KEY_ALIAS: ${{ secrets.GROD_KEY_ALIAS }}
          GROD_KEY_PASSWORD: ${{ secrets.GROD_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.GROD_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/grod-release.jks"
          export GROD_KEYSTORE_FILE="$RUNNER_TEMP/grod-release.jks"
          ./gradlew --no-daemon assembleRelease -PgrodVersionName=${{ steps.v.outputs.name }} -PgrodVersionCode=${{ steps.v.outputs.code }}
          apk="$(find app/build/outputs/apk/release -name '*.apk' | head -1)"
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify "$apk"
          cp "$apk" "$RUNNER_TEMP/grod-${{ steps.v.outputs.name }}.apk"

      - name: Browser extension
        working-directory: extension
        run: |
          # Only what the browser loads: no tests, scripts or node_modules.
          zip -r "$RUNNER_TEMP/grod-extension-${{ steps.v.outputs.name }}.zip" \
            manifest.json background.js content.js blocked.html blocked.js popup.html popup.js rules.json lib icons ui

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/grod-${{ steps.v.outputs.name }}.apk" \
            "$RUNNER_TEMP/grod-extension-${{ steps.v.outputs.name }}.zip" \
            --title "grod ${{ steps.v.outputs.name }}" \
            --notes-file docs/release-notes.md
